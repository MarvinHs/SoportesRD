<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="Técnico de soporte trabajando con equipos y redes">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1677FF"/><stop offset="1" stop-color="#0d4fb3"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1F3A" flood-opacity=".28"/></filter>
  </defs>
  <!-- red de nodos -->
  <g stroke="#1677FF" stroke-opacity=".35" stroke-width="1.5" fill="none">
    <path d="M40 80 L140 40 L250 70 L380 30 L520 90"/><path d="M140 40 L120 150"/><path d="M380 30 L430 140"/><path d="M520 90 L500 230"/><path d="M40 80 L60 260"/>
  </g>
  <g fill="#1677FF"><circle cx="40" cy="80" r="5"/><circle cx="140" cy="40" r="6"/><circle cx="250" cy="70" r="4"/><circle cx="380" cy="30" r="6"/><circle cx="520" cy="90" r="5"/><circle cx="60" cy="260" r="4"/><circle cx="500" cy="230" r="4"/></g>
  <!-- monitor -->
  <g filter="url(#sh)">
    <rect x="110" y="110" width="340" height="220" rx="16" fill="#0B1F3A"/>
    <rect x="124" y="124" width="312" height="180" rx="8" fill="url(#scr)"/>
  </g>
  <rect x="250" y="330" width="60" height="34" fill="#0B1F3A"/>
  <rect x="200" y="362" width="160" height="12" rx="6" fill="#0B1F3A"/>
  <!-- contenido pantalla -->
  <rect x="144" y="144" width="120" height="10" rx="5" fill="#fff" opacity=".9"/>
  <rect x="144" y="164" width="80" height="8" rx="4" fill="#fff" opacity=".5"/>
  <g fill="#fff" opacity=".85"><rect x="150" y="250" width="18" height="36" rx="3"/><rect x="176" y="232" width="18" height="54" rx="3"/><rect x="202" y="214" width="18" height="72" rx="3"/><rect x="228" y="240" width="18" height="46" rx="3"/><rect x="254" y="200" width="18" height="86" rx="3"/></g>
  <path d="M300 270 L330 240 L355 255 L400 200" fill="none" stroke="#7fe0a3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="200" r="6" fill="#7fe0a3"/>
  <!-- tarjeta ticket -->
  <g filter="url(#sh)">
    <rect x="360" y="60" width="180" height="96" rx="14" fill="url(#card)"/>
  </g>
  <circle cx="390" cy="92" r="14" fill="#16A34A"/><path d="M383 92l5 5 9-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="414" y="84" width="100" height="8" rx="4" fill="#0B1F3A"/><rect x="414" y="98" width="70" height="7" rx="3.5" fill="#9aa8bd"/>
  <rect x="378" y="124" width="70" height="18" rx="9" fill="#dcfce7"/><text x="413" y="137" font-family="Arial" font-size="10" font-weight="bold" fill="#16A34A" text-anchor="middle">RESUELTO</text>
  <!-- tarjeta wifi -->
  <g filter="url(#sh)"><rect x="20" y="170" width="130" height="110" rx="14" fill="url(#card)"/></g>
  <g fill="none" stroke="#1677FF" stroke-width="5" stroke-linecap="round"><path d="M50 222a40 40 0 0 1 70 0"/><path d="M62 236a24 24 0 0 1 46 0"/></g>
  <circle cx="85" cy="252" r="6" fill="#1677FF"/>
  <rect x="50" y="262" width="70" height="6" rx="3" fill="#9aa8bd"/>
  <!-- escudo -->
  <g filter="url(#sh)"><path d="M470 270l50 18v36c0 30-22 48-50 56-28-8-50-26-50-56v-36z" fill="#0B1F3A"/></g>
  <path d="M452 322l12 12 24-26" stroke="#16A34A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- engranaje -->
  <g transform="translate(70 360)" fill="#1677FF"><circle r="22"/><g fill="#1677FF">
    <rect x="-6" y="-32" width="12" height="14" rx="3"/><rect x="-6" y="18" width="12" height="14" rx="3"/><rect x="-32" y="-6" width="14" height="12" rx="3"/><rect x="18" y="-6" width="14" height="12" rx="3"/></g>
    <circle r="9" fill="#F4F7FB"/></g>
</svg>
